<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GourmetFlow - Reserva</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }</style><style id="icase-design-system">
:root{--icase-primary:#0b57d0;--icase-primary-dark:#073d8c;--icase-secondary:#64748b;--icase-bg:#f8fafc;--icase-surface:#ffffff;--icase-text:#0f172a;--icase-success:#059669;--icase-warning:#d97706;--icase-error:#dc2626}
html,body{background-color:var(--icase-bg)!important;color:var(--icase-text)!important}
.bg-blue-500,.bg-blue-600,.bg-blue-700,.bg-primary-500,.bg-primary-600,.bg-primary-700{background-color:var(--icase-primary)!important}
.text-blue-500,.text-blue-600,.text-blue-700,.text-primary-500,.text-primary-600,.text-primary-700{color:var(--icase-primary)!important}
.border-blue-500,.border-blue-600,.border-primary-500,.border-primary-600{border-color:var(--icase-primary)!important}
.bg-emerald-500,.bg-green-500,.bg-green-600{background-color:var(--icase-success)!important}
.text-emerald-600,.text-green-600,.text-green-700{color:var(--icase-success)!important}
.text-amber-600,.text-yellow-600{color:var(--icase-warning)!important}
.text-red-600,.text-red-700{color:var(--icase-error)!important}
</style></head><body class="bg-slate-50 flex justify-center items-center min-h-screen"><div class="w-[390px] bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200 flex flex-col h-[844px] justify-between"><header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center"><div class="font-bold text-[#0b57d0] text-lg">GourmetFlow</div><div class="text-xs text-emerald-600 font-medium bg-emerald-50 px-2 py-1 rounded-full">Sistema en línea</div></header><nav class="bg-slate-50 border-b border-slate-200 px-2 py-1.5 flex justify-around text-[10px] text-slate-600 font-medium"><span class="text-slate-400">Menú</span><span class="text-[#0b57d0] font-bold border-b-2 border-[#0b57d0] pb-0.5">Reserva</span><span class="text-slate-400">QR</span><span class="text-slate-400">Paquetes</span><span class="text-slate-400">Puntos</span></nav><main class="flex-1 overflow-y-auto p-4 space-y-4"><h1 class="text-lg font-bold text-slate-900">Nueva Reserva de Mesa</h1><p class="text-xs text-slate-500">Complete los datos para asegurar su lugar y acumular puntos.</p><form class="space-y-3"><div class="space-y-1"><label class="block text-xs font-semibold text-slate-700">Fecha y Hora</label><input type="datetime-local" required class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-[#0b57d0]" value="2023-11-20T20:00"></div><div class="space-y-1"><label class="block text-xs font-semibold text-slate-700">Número de Sillas / Personas</label><input type="number" min="1" max="10" required class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-[#0b57d0]" value="2"></div><div class="space-y-1"><label class="block text-xs font-semibold text-slate-700">Seleccionar Mesa Disponible</label><select class="w-full text-xs px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:border-[#0b57d0]"><option>Mesa 04 - Capacidad 4 (Disponible)</option><option>Mesa 08 - Capacidad 2 (Disponible)</option><option>Mesa 12 - Capacidad 6 (Ocupada)</option></select></div><div class="p-3 bg-blue-50 border border-blue-100 rounded-lg text-[11px] text-[#0b57d0]">Al confirmar su reserva se generará un código QR único y acumulará puntos para su cuenta.</div><button type="submit" class="w-full py-2.5 bg-[#0b57d0] hover:bg-[#073d8c] text-white font-semibold text-xs rounded-lg transition shadow-sm">Confirmar Reserva</button></form></main><footer class="bg-white border-t border-slate-200 py-2 text-center text-[10px] text-slate-400">GourmetFlow App Cliente</footer></div></body></html>
