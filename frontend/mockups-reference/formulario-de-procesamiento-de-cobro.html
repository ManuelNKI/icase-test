<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Procesamiento de Cobro - GourmetFlow</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body { font-family: 'Inter', sans-serif; }</style><style id="icase-design-system">
:root{--icase-primary:#0b57d0;--icase-primary-dark:#073d8c;--icase-secondary:#64748b;--icase-bg:#f8fafc;--icase-surface:#ffffff;--icase-text:#0f172a;--icase-success:#059669;--icase-warning:#d97706;--icase-error:#dc2626}
html,body{background-color:var(--icase-bg)!important;color:var(--icase-text)!important}
.bg-blue-500,.bg-blue-600,.bg-blue-700,.bg-primary-500,.bg-primary-600,.bg-primary-700{background-color:var(--icase-primary)!important}
.text-blue-500,.text-blue-600,.text-blue-700,.text-primary-500,.text-primary-600,.text-primary-700{color:var(--icase-primary)!important}
.border-blue-500,.border-blue-600,.border-primary-500,.border-primary-600{border-color:var(--icase-primary)!important}
.bg-emerald-500,.bg-green-500,.bg-green-600{background-color:var(--icase-success)!important}
.text-emerald-600,.text-green-600,.text-green-700{color:var(--icase-success)!important}
.text-amber-600,.text-yellow-600{color:var(--icase-warning)!important}
.text-red-600,.text-red-700{color:var(--icase-error)!important}
</style></head><body class="bg-[#f8fafc] text-[#0f172a] h-screen flex overflow-hidden"><aside class="w-64 bg-white border-r border-[#cbd5e1] flex flex-col justify-between"><div class="p-6"><h1 class="text-xl font-bold text-[#0b57d0] tracking-tight mb-6">GourmetFlow</h1><nav class="space-y-1"><a href="#" class="block px-4 py-2.5 rounded-lg text-sm font-medium bg-[#0b57d0] text-white">Formulario de Procesamiento de Cobro</a><a href="#" class="block px-4 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Vista de Validación de Plan Prepagado</a></nav></div><div class="p-4 border-t border-slate-200 text-xs text-slate-500 flex items-center space-x-2"><span class="w-2.5 h-2.5 rounded-full bg-[#059669]"></span><span>Sistema en línea</span></div></aside><div class="flex-1 flex flex-col overflow-hidden"><header class="h-16 bg-white border-b border-[#cbd5e1] flex items-center justify-between px-8 shadow-sm"><h2 class="text-lg font-semibold text-slate-800">Panel de Cobros y Planes</h2><div class="flex items-center space-x-4"><span class="text-sm font-medium text-slate-600">Cajero: Carlos Pérez</span><div class="w-9 h-9 rounded-full bg-[#0b57d0] text-white flex items-center justify-center font-bold text-sm">CP</div></div></header><main class="flex-1 overflow-y-auto p-8"><div class="max-w-4xl mx-auto bg-white rounded-xl border border-[#cbd5e1] shadow-sm p-8"><h3 class="text-xl font-bold text-slate-900 mb-6">Procesar Cobro de Pedido</h3><form class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="block text-sm font-medium text-slate-700 mb-2">ID de Pedido</label><input type="text" placeholder="Ej. PED-8942" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#0b57d0] focus:outline-none text-sm" required></div><div><label class="block text-sm font-medium text-slate-700 mb-2">Método de Pago</label><select class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#0b57d0] focus:outline-none text-sm bg-white" required><option>Efectivo</option><option>Transferencia</option><option>Paquete Prepagado</option></select></div><div><label class="block text-sm font-medium text-slate-700 mb-2">Monto Total ($)</label><input type="number" step="0.01" placeholder="0.00" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#0b57d0] focus:outline-none text-sm" required></div><div><label class="block text-sm font-medium text-slate-700 mb-2">Código de Plan Prepagado (Opcional)</label><input type="text" placeholder="PLAN-XXXX" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#0b57d0] focus:outline-none text-sm"></div></div><div class="pt-4 border-t border-slate-200 flex justify-end space-x-4"><button type="button" class="px-6 py-2.5 rounded-lg border border-slate-300 text-slate-700 font-medium text-sm hover:bg-slate-50">Limpiar</button><button type="submit" class="px-6 py-2.5 rounded-lg bg-[#0b57d0] text-white font-medium text-sm hover:bg-[#073d8c] shadow-sm">Procesar Cobro</button></div></form></div></main></div></body></html>
